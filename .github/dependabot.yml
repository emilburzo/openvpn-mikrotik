version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  # Proposes new Alpine releases. Their PRs run test/routeros.sh against the pinned openvpn~2.7,
  # so a release without OpenVPN 2.7, or one that breaks MikroTik clients, fails its checks.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
